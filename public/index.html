:root{
  --bg:#14122b; --bg-2:rgba(255,255,255,.06); --card:rgba(255,255,255,.06); --card-2:rgba(255,255,255,.12);
  --border:rgba(255,255,255,.14); --text:#f3f1fb; --text-dim:rgba(243,241,251,.68); --text-mute:rgba(243,241,251,.42);
  --accent:#6c5ce7; --accent-2:#5a4bd1; --accent-soft:#2a2350;
  --success:#2bb89a; --success-soft:#153a33;
  --gold:#c8a34a; --danger:#e0605a; --danger-soft:#3a2020;
  --warn:#e0a83a; --warn-soft:#3a2f14;
  --info:#6c5ce7;
  --radius:18px; --radius-sm:12px;
  --shadow:0 8px 28px rgba(0,0,0,.4);
  --header-h:56px; --footer-h:64px;
  --body-bg:linear-gradient(165deg, #1e1b39 0%, #2d2755 45%, #3d3565 100%);
  --glass-blur:blur(18px);
  --modal-bg:rgba(18,16,35,.88);
  --chrome-bg:rgba(24,21,45,.93);
}
[data-theme="light"]{
  --bg:#f4f2fb; --bg-2:#ffffff; --card:#ffffff; --card-2:#f0eefa;
  --border:#e2ddf5; --text:#1a1533; --text-dim:#5c5578; --text-mute:#8a83a5;
  --accent:#6c5ce7; --accent-2:#5a4bd1; --accent-soft:#ece8fc;
  --success:#1e9e83; --success-soft:#e3f5f0;
  --gold:#a9832e; --danger:#c53d38; --danger-soft:#fbe6e5;
  --warn:#a9781f; --warn-soft:#fbf1de;
  --info:#6c5ce7;
  --shadow:0 2px 12px rgba(60,50,120,.08);
  --body-bg:#f4f2fb;
  --glass-blur:none;
  --modal-bg:#ffffff;
  --chrome-bg:#ffffff;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
svg{width:16px; height:16px; flex-shrink:0;}
html,body{height:100%;}
body{
  margin:0; background:var(--body-bg); background-attachment:fixed; color:var(--text);
  font-family:'Tajawal','Cairo',system-ui,sans-serif;
  font-size:14px; line-height:1.5;
  height:100vh; overflow-y:auto; overflow-x:hidden;
}
body[dir="ltr"]{direction:ltr;}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit; font-size:14px;}
a{color:var(--accent); text-decoration:none;}
::-webkit-scrollbar{width:8px; height:8px;}
::-webkit-scrollbar-thumb{background:var(--border); border-radius:4px;}

/* ===== Header ===== */
#app-header{
  position:fixed; top:0; right:0; left:0; height:var(--header-h);
  background:var(--chrome-bg); backdrop-filter:blur(22px); -webkit-backdrop-filter:blur(22px);
  border-bottom:1px solid var(--border);
  box-shadow:0 4px 18px rgba(0,0,0,.12);
  display:flex; align-items:center; justify-content:space-between;
  padding:0 16px; z-index:50; gap:8px; overflow:hidden;
}
.hdr-brand{display:flex; align-items:center; gap:10px; min-width:0;}
.hdr-logo{width:34px; height:34px; border-radius:10px; object-fit:cover; background:var(--accent-soft); flex-shrink:0; box-shadow:0 2px 6px rgba(0,0,0,.2);}
.hdr-logo-ph{width:34px;height:34px;border-radius:10px;background:linear-gradient(155deg, var(--accent), var(--accent-2));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;flex-shrink:0; box-shadow:0 2px 6px rgba(0,0,0,.25);}
.hdr-shop{font-weight:800; font-size:14.5px; letter-spacing:.2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:36vw;}
.hdr-date{font-size:11.5px; color:var(--text-dim); text-align:center; flex:1; white-space:nowrap; font-weight:600;}
.hdr-user{display:flex; align-items:center; gap:8px; font-size:12px; color:var(--text-dim); white-space:nowrap;}
.hdr-user-avatar{width:26px; height:26px; border-radius:50%; background:var(--card-2); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; color:var(--accent); flex-shrink:0;}
.hdr-user b{color:var(--text); font-size:12.5px; font-weight:700;}
.icon-btn{
  background:transparent; border:none; color:var(--text-dim); padding:6px;
  border-radius:8px; display:flex; align-items:center; justify-content:center;
}
.icon-btn:hover{background:var(--card-2); color:var(--text);}
.icon-btn svg{width:18px; height:18px;}

/* ===== Footer ===== */
#app-footer{
  position:fixed; bottom:0; right:0; left:0; height:var(--footer-h);
  background:var(--chrome-bg); backdrop-filter:blur(22px); -webkit-backdrop-filter:blur(22px);
  border-top:1px solid var(--border);
  box-shadow:0 -4px 18px rgba(0,0,0,.12);
  display:flex; align-items:center;
  z-index:50; padding:6px 10px;
}
.footer-group{display:flex; align-items:center; gap:2px;}
.footer-btn{
  display:flex; flex-direction:column; align-items:center; gap:3px;
  background:transparent; border:none; color:var(--text-dim); font-size:10.5px; font-weight:600;
  padding:7px 4px; border-radius:12px; flex:1;
}
.footer-btn:active{background:var(--card-2);}
.footer-btn svg{width:20px; height:20px;}
.footer-btn.primary{
  background:var(--accent); color:#fff; font-weight:700; box-shadow:0 3px 10px rgba(0,0,0,.25);
}
.footer-btn.primary svg{stroke:#fff; width:20px; height:20px;}
.footer-btn:active{opacity:.7;}

/* ===== Bottom sheet nav ===== */
#nav-overlay{
  position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:60;
  display:none; align-items:flex-end; justify-content:center;
}
#nav-overlay.open{display:flex;}
#nav-sheet{
  background:var(--modal-bg); width:100%; max-width:520px;
  border-radius:18px 18px 0 0; padding:10px 8px calc(var(--footer-h) + 10px);
  box-shadow:var(--shadow); backdrop-filter:var(--glass-blur); -webkit-backdrop-filter:var(--glass-blur);
  border:1px solid var(--border); border-bottom:none;
  animation:slideup .18s ease-out;
}
@media (min-width:900px){
  #nav-sheet{max-width:800px; border-radius:18px;}
}
@keyframes slideup{from{transform:translateY(20px); opacity:0;} to{transform:translateY(0); opacity:1;}}
.sheet-handle{width:40px; height:4px; background:var(--border); border-radius:2px; margin:6px auto 10px;}
.nav-item{
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; padding:14px 8px; border-radius:12px;
  color:var(--text); font-size:12px; font-weight:600; text-align:center;
  background:transparent; border:none; width:100%; line-height:1.3;
}
.nav-item:active,.nav-item.active{background:var(--card-2); color:var(--accent);}
.nav-item svg{width:22px; height:22px; flex-shrink:0;}
.nav-item .badge{margin-inline-start:auto; background:var(--danger); color:#fff; font-size:11px; padding:1px 7px; border-radius:10px;}
.nav-grid{display:flex; flex-direction:row; gap:2px; padding-bottom:2px;}
.nav-item{flex:1; min-width:0; padding:10px 2px; font-size:10px;}
.nav-item svg{width:19px; height:19px;}
@media (min-width:900px){
  .nav-item{flex-direction:row; padding:12px 10px; font-size:13px;}
  .nav-item svg{width:20px; height:20px;}
}

/* ===== Main ===== */
#app-main{
  position:fixed; top:calc(var(--header-h) + 10px); bottom:calc(var(--footer-h) + 10px);
  left:0; right:0; overflow-y:auto; -webkit-overflow-scrolling:touch;
  max-width:1100px; margin:0 auto; padding:4px 10px 30px;
}
#app-main > *:last-child{margin-bottom:20px;}

/* ===== Desktop Sidebar ===== */
#app-sidebar{display:none;}
@media (min-width:900px){
  :root{--sidebar-w:224px;}
  #app-sidebar{
    display:flex; flex-direction:column; gap:2px;
    position:fixed; top:var(--header-h); bottom:0; right:0; left:auto; width:var(--sidebar-w);
    background:var(--chrome-bg); border-left:1px solid var(--border);
    padding:16px 10px; z-index:40; overflow-y:auto; box-sizing:border-box;
  }
  body[dir="ltr"] #app-sidebar{right:auto; left:0; border-left:none; border-right:1px solid var(--border);}
  .sidebar-item{
    display:flex; align-items:center; gap:12px; padding:11px 14px; border-radius:12px;
    color:var(--text-dim); font-size:14px; font-weight:600; background:none; border:none; text-align:start; width:100%;
  }
  .sidebar-item svg{width:19px; height:19px; flex-shrink:0;}
  .sidebar-item:hover{background:var(--card-2); color:var(--text);}
  .sidebar-item.active{background:var(--accent-soft); color:var(--accent);}
  .sidebar-toggle{align-self:flex-end; margin-bottom:10px;}
  #app-main{right:var(--sidebar-w); left:0; max-width:none; margin:0; padding-inline:28px; box-sizing:border-box;}
  body[dir="ltr"] #app-main{left:var(--sidebar-w); right:0;}
  #app-footer{right:var(--sidebar-w); left:0;}
  body[dir="ltr"] #app-footer{left:var(--sidebar-w); right:0;}
  [data-action="open-nav"]{display:none;}
}
.page-title{font-size:18px; font-weight:800; margin:4px 0 12px; display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap;}

.btn-sm{padding:4px 9px; font-size:11.5px;}

/* غيّر هذا الرابط لرابط خادم التفعيل الحقيقي الخاص بك بعد نشره، قبل توزيع النسخة على عملائك */
const LICENSE_SERVER_URL = 'https://debt-manager-server-v5.bonto.run';
let dbConn=null;
function dbOpen(){
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = (e)=>{
      const db=e.target.result;
      if(!db.objectStoreNames.contains(DB_STORE)) db.createObjectStore(DB_STORE);
    };
    req.onsuccess=(e)=>{dbConn=e.target.result; resolve(dbConn);};
    req.onerror=(e)=>reject(e);
  });
}
function dbGet(){
  return new Promise((resolve,reject)=>{
    const tx=dbConn.transaction(DB_STORE,'readonly');
    const req=tx.objectStore(DB_STORE).get(DB_KEY);
    req.onsuccess=()=>resolve(req.result);
    req.onerror=(e)=>reject(e);
  });
}
function dbSet(val){
  return new Promise((resolve,reject)=>{
    const tx=dbConn.transaction(DB_STORE,'readwrite');
    tx.objectStore(DB_STORE).put(val, DB_KEY);
    tx.oncomplete=()=>resolve(true);
    tx.onerror=(e)=>reject(e);
  });
}

/* ---------------- Helpers ---------------- */
function uid(){ return 'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function pad4(n){ return String(n).padStart(4,'0'); }
function fmtMoney(n){
  n = Math.round(Number(n)||0);
  return n.toLocaleString('en-US');
}
function fmtDate(d){
  if(!d) return '-';
  const dt = (d instanceof Date)? d : new Date(d);
  if(isNaN(dt.getTime())) return '-';
  const dd=String(dt.getDate()).padStart(2,'0');
  const mm=String(dt.getMonth()+1).padStart(2,'0');
  const yy=dt.getFullYear();
  return `${yy}/${mm}/${dd}`;
}
function todayISO(){ return new Date().toISOString().slice(0,10); }
function addInterval(dateStr, freq, times){
  const d = new Date(dateStr);
  if(freq==='daily') d.setDate(d.getDate()+times);
  else if(freq==='weekly') d.setDate(d.getDate()+ (7*times));
  else d.setMonth(d.getMonth()+times);
  return d.toISOString().slice(0,10);
}
function daysBetween(a,b){
  const d1=new Date(a), d2=new Date(b);
  return Math.round((d2-d1)/86400000);
}
function toast(msg, type){
  const wrap=document.getElementById('toast-wrap');
  const el=document.createElement('div');
  el.className='toast'+(type?(' '+type):'');
  el.textContent=msg;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(),300); }, 2400);
}
function digitsOnly(v){ return (v||'').replace(/[^0-9]/g,''); }
function isValidPhone(v){ return /^[0-9]{11}$/.test(v||''); }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function initials(name){ return (name||'?').trim().charAt(0).toUpperCase(); }

function compressImage(file, maxDim=800, quality=0.72){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=(e)=>{
      const img=new Image();
      img.onload=()=>{
        let w=img.width, h=img.height;
        if(w>h){ if(w>maxDim){h=Math.round(h*maxDim/w); w=maxDim;} }
        else{ if(h>maxDim){w=Math.round(w*maxDim/h); h=maxDim;} }
        const canvas=document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror=reject;
      img.src=e.target.result;
    };
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}

/* ---------------- Business logic ---------------- */
function buildInstallments(principal, calcMode, inputValue, firstDate, freq){
  principal = Math.round(Number(principal));
  let count, amount;
  if(calcMode==='amount'){
    amount = Math.max(1, Math.round(Number(inputValue)));
    count = Math.floor(principal/amount);
    if(count<1) count=1;
    if(principal % amount !== 0) count += 1; // extra installment covers remainder
  } else {
    count = Math.max(1, Math.round(Number(inputValue)));
    amount = Math.floor(principal/count);
  }
  const list=[];
  let sum=0;
  for(let i=0;i<count;i++){
    let amt;
    if(i===count-1){ amt = principal - sum; } // last installment covers remainder (could be less or more)
    else { amt = amount; }
    sum += amt;
    list.push({
      idx:i+1, dueDate: addInterval(firstDate, freq, i), amount: amt,
      paidAmount:0, status:'pending'
    });
  }
  return list;
}

function debtRemaining(debt){
  if(debt.paymentType==='single'){
    const paid = (debt.payments||[]).filter(p=>!p.cancelled).reduce((s,p)=>s+p.amount,0);
    return Math.max(0, debt.principal - paid);
  }
  return (debt.installments||[]).reduce((s,i)=>s + Math.max(0, i.amount - (i.paidAmount||0)), 0);
}

function refreshInstallmentStatuses(debt, graceDays){
  graceDays = graceDays||0;
  const today = todayISO();
  (debt.installments||[]).forEach(inst=>{
    const remaining = inst.amount - (inst.paidAmount||0);
    if(remaining<=0){ inst.status='paid'; return; }
    if((inst.paidAmount||0)>0){ inst.status='partial'; }
    const dueWithGrace = addInterval(inst.dueDate,'daily',graceDays);
    if(today > dueWithGrace){ inst.status='late'; }
    else if((inst.paidAmount||0)<=0){ inst.status='pending'; }
  });
}

function computeDebtStatus(debt, graceDays){
  if(debt.status==='cancelled') return 'cancelled';
  if(debt.paymentType==='single'){
    const rem = debtRemaining(debt);
    if(rem<=0) return 'paid';
    const dueWithGrace = addInterval(debt.startDate||debt.createdAt.slice(0,10),'daily',graceDays||0);
    return (todayISO()>dueWithGrace)? 'late':'active';
  }
  refreshInstallmentStatuses(debt, graceDays);
  const insts = debt.installments||[];
  const rem = debtRemaining(debt);
  if(rem<=0) return 'paid';
  const anyLate = insts.some(i=>i.status==='late');
  return anyLate? 'late':'active';
}

function isDelinquent(debt, graceDays){
  if(debt.paymentType!=='installments') return false;
  refreshInstallmentStatuses(debt, graceDays);
  const lateCount = (debt.installments||[]).filter(i=>i.status==='late').length;
  return lateCount>1;
}

function customerTotals(customerId){
  const debts = DATA.debts.filter(d=>d.customerId===customerId && d.status!=='cancelled');
  let iqd=0, usd=0;
  debts.forEach(d=>{
    const rem = debtRemaining(d);
    if(d.currency==='IQD') iqd+=rem; else usd+=rem;
  });
  return {iqd, usd};
}
function guarantorTotals(guarantorId){
  const debts = DATA.debts.filter(d=>(d.guarantorIds||[]).includes(guarantorId) && d.status!=='cancelled');
  let iqd=0, usd=0;
  debts.forEach(d=>{
    const rem=debtRemaining(d);
    if(d.currency==='IQD') iqd+=rem; else usd+=rem;
  });
  return {iqd, usd, count: new Set(debts.map(d=>d.customerId)).size};
}
function customerOverallStatus(customerId){
  const graceDays = DATA.settings.gracePeriodDays||0;
  const debts = DATA.debts.filter(d=>d.customerId===customerId && d.status!=='cancelled');
  if(debts.length===0) return 'active';
  if(debts.some(d=>isDelinquent(d,graceDays))) return 'delinquent';
  const statuses = debts.map(d=>computeDebtStatus(d,graceDays));
  if(statuses.every(s=>s==='paid')) return 'paid';
  if(statuses.some(s=>s==='late')) return 'late';
  return 'active';
}
/* Reusable grid-table renderer: cols = CSS grid-template-columns value, headers = array of strings,
   rows = array of {cells:[htmlString,...], onClick: dataAttrString} */
function renderGridTable(cols, headers, rows, maxHeight){
  const style = `grid-template-columns:${cols};`;
  const headHtml = `<div class="gtable-head" style="${style}">${headers.map(h=>`<div class="gtable-cell">${h}</div>`).join('')}</div>`;
  const rowsHtml = rows.map(r=>`<div class="gtable-row${r.rowClass?(' '+r.rowClass):''}" style="${style}" ${r.attrs||''}>${r.cells.map(c=>`<div class="gtable-cell">${c}</div>`).join('')}</div>`).join('');
  return `<div class="gtable"><div class="gtable-scroll" style="${maxHeight?`max-height:${maxHeight};`:''}">${headHtml}${rowsHtml}</div></div>`;
}

/* ---------------- Custom Select Wrapper ---------------- */
function enhanceSelects(root){
  (root||document).querySelectorAll('select').forEach(sel=>{
    if(sel.dataset.enhanced) return;
    sel.dataset.enhanced='1';
    const wrap = document.createElement('div');
    wrap.className='cselect';
    sel.parentNode.insertBefore(wrap, sel);
    wrap.appendChild(sel);

    const trigger = document.createElement('button');
    trigger.type='button';
    trigger.className='cselect-trigger';
    const labelSpan = document.createElement('span');
    labelSpan.textContent = sel.options[sel.selectedIndex] ? sel.options[sel.selectedIndex].text : '';
    trigger.appendChild(labelSpan);
    trigger.insertAdjacentHTML('beforeend', ICONS.chevronDown);
    wrap.appendChild(trigger);

    const list = document.createElement('div');
    list.className='cselect-list';
    Array.from(sel.options).forEach((opt,i)=>{
      const item = document.createElement('div');
      item.className = 'cselect-option' + (i===sel.selectedIndex ? ' selected':'');
      item.textContent = opt.text;
      item.onclick=(e)=>{
        e.stopPropagation();
        sel.selectedIndex = i;
        sel.dispatchEvent(new Event('change', {bubbles:true}));
        labelSpan.textContent = opt.text;
        list.querySelectorAll('.cselect-option').forEach(x=>x.classList.remove('selected'));
        item.classList.add('selected');
        wrap.classList.remove('open');
      };
      list.appendChild(item);
    });
    wrap.appendChild(list);

    trigger.onclick=(e)=>{
      e.stopPropagation();
      const wasOpen = wrap.classList.contains('open');
      document.querySelectorAll('.cselect.open').forEach(x=>x.classList.remove('open'));
      if(!wasOpen) wrap.classList.add('open');
    };
  });
}
document.addEventListener('click', ()=>{ document.querySelectorAll('.cselect.open').forEach(x=>x.classList.remove('open')); });

function attachImageViewers(){
  document.querySelectorAll('[data-view-image]').forEach(img=>{
    img.onclick=()=>openImageViewer(img.src, img.dataset.viewImage);
  });
}
function openImageViewer(src, title){
  openModal(`
    <div class="modal-head"><h3>${esc(title)} — ${t('id_image')}</h3><button class="icon-btn" data-action="close-modal">✕</button></div>
    <img src="${src}" style="width:100%; border-radius:10px; border:1px solid var(--border); display:block;">
    <div class="flex-gap" style="margin-top:14px;">
      <button class="btn btn-primary" data-action="img-print">${ICONS.print} ${t('print')}</button>
      <button class="btn" data-action="img-share">${ICONS.share} ${t('share')}</button>
    </div>
  `);
  document.querySelector('[data-action="close-modal"]').onclick=closeModal;
  document.querySelector('[data-action="img-print"]').onclick=()=>{
    const printDiv = document.createElement('div');
    printDiv.className='print-only print-area';
    printDiv.innerHTML = `<div style="text-align:center; padding:20px;"><h3>${esc(title)}</h3><img src="${src}" style="max-width:100%;"></div>`;
    document.body.appendChild(printDiv);
    window.print();
    setTimeout(()=>document.body.removeChild(printDiv), 500);
  };
  document.querySelector('[data-action="img-share"]').onclick=async()=>{
    try{
      if(navigator.share && navigator.canShare){
        const res = await fetch(src);
        const blob = await res.blob();
        const file = new File([blob], 'id-document.jpg', {type: blob.type||'image/jpeg'});
        if(navigator.canShare({files:[file]})){
          await navigator.share({files:[file], title: title});
          return;
        }
      }
      // Fallback (most desktop browsers, including Windows): direct download from the data URL
      const a = document.createElement('a');
      a.href = src; a.download = 'id-document.jpg';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      toast(t('download'),'success');
    }catch(e){
      // Even if share attempt failed/was cancelled, still offer the download fallback
      try{
        const a = document.createElement('a');
        a.href = src; a.download = 'id-document.jpg';
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        toast(t('download'),'success');
      }catch(e2){ toast(t('error_generic'),'error'); }
    }
  };
}

function statusBadge(status){

    delinquent:['badge-danger', t('delinquent')], paid:['badge-mute', t('paid')],
    cancelled:['badge-mute', t('cancelled')]
  };
  const [cls,label] = map[status]||['badge-mute',status];
  return `<span class="badge ${cls}">${label}</span>`;
}

function nextReceiptNo(kind){
  if(kind==='debt'){
    const n = DATA.settings.receiptStartDebt + DATA.settings.receiptCounterDebt;
    DATA.settings.receiptCounterDebt++;
    return pad4(n);
  } else {
    const n = DATA.settings.receiptStartPayment + DATA.settings.receiptCounterPayment;
    DATA.settings.receiptCounterPayment++;
    return pad4(n);
  }
}

function applyPaymentToInstallment(debt, instIdx, amount){
  const insts = debt.installments;
  let remainingToApply = amount;
  let i = insts.findIndex(x=>x.idx===instIdx);
  let touchedFirst = null;
  while(remainingToApply>0 && i<insts.length){
    const inst = insts[i];
    const due = inst.amount - (inst.paidAmount||0);
    if(due<=0){ i++; continue; }
    const applied = Math.min(due, remainingToApply);
    inst.paidAmount = (inst.paidAmount||0) + applied;
    if(touchedFirst===null) touchedFirst = inst.idx;
    remainingToApply -= applied;
    i++;
  }
  return { overflow: remainingToApply, touchedFrom: touchedFirst };
}

/* ---------------- Root render ---------------- */
function render(){
  applyTheme(); applyLang();
  const root = document.getElementById('app-root');
  if(!DATA.settings.username || !DATA.settings.password){
    root.innerHTML = renderSetupAccount(); attachSetupEvents(); return;
  }
  if(!DATA.settings.activationCode){
    if(UI.showJoinRequest){ root.innerHTML = renderJoinRequest(); attachJoinRequestEvents(); return; }
    root.innerHTML = renderActivation(); attachActivationEvents(); return;
  }
  if(UI.subscriptionBlocked){
    root.innerHTML = renderSubscriptionBlocked(); attachSubscriptionBlockedEvents(); return;
  }
  if(!UI.loggedIn){
    UI.loggedIn = true; // TEMP: login step disabled per user request
  }
  root.innerHTML = `
    ${renderHeader()}
    ${renderSidebar()}
    <main id="app-main" class="fade-in">${renderPage()}</main>
    ${renderFooter()}
    ${renderNavOverlay()}
    ${renderModalHost()}
  `;
  attachGlobalEvents();
  attachPageEvents();
  enhanceSelects(document.getElementById('app-main'));
  checkBackupReminder();
}

  const btn = document.querySelector('[data-action="retry-subscription-check"]');
  if(btn) btn.onclick = async ()=>{ await checkSubscriptionStatus(); render(); };

async function checkSubscriptionStatus(){
  if(!DATA.settings.activationCode) return;
  try{
    const res = await fetch(LICENSE_SERVER_URL + '/api/check-subscription', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({code: DATA.settings.activationCode})
    });
    const data = await res.json();
    if(data && data.valid===false && (data.reason==='revoked' || data.reason==='expired' || data.reason==='not_found')){
      UI.subscriptionBlocked = true;
      UI.subscriptionBlockReason = data.reason;
    } else if(data && data.valid===true){
      UI.subscriptionBlocked = false;
      UI.subscriptionBlockReason = null;
      if(data.expiresAt) DATA.settings.subscriptionEnd = data.expiresAt.slice(0,10);
    }
    // network/server errors: fail open (don't block), keep last known state
  }catch(e){ /* offline: fail open, don't block usage */ }
}

      toast('تعذّر التحقق من الكود، تأكد من اتصالك بالإنترنت وحاول مجدداً', 'error');

  if(sendBtn) sendBtn.onclick=async()=>{

    const note = document.getElementById('jr-note').value.trim();
    if(!name){ toast(t('required_field'),'error'); return; }

    sendBtn.disabled = true;
    try{
      const res = await fetch(LICENSE_SERVER_URL + '/api/join-request', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({customerName:name, phone, note})
      });
      const data = await res.json();
      if(!res.ok || !data.ok) throw new Error('failed');
      UI.joinRequestSent = true;
      render();
    }catch(e){
      toast(t('join_send_failed'),'error');
      sendBtn.disabled = false;

/* ---------------- Dashboard ---------------- */
function renderDashboard(){
  const grace = DATA.settings.gracePeriodDays||0;
  const activeDebts = DATA.debts.filter(d=>d.status!=='cancelled');
  let totalIQD=0, totalUSD=0;
  activeDebts.forEach(d=>{ const r=debtRemaining(d); if(d.currency==='IQD') totalIQD+=r; else totalUSD+=r; });

  let overdueInsts=[];
  activeDebts.forEach(d=>{
    if(d.paymentType==='installments'){
      refreshInstallmentStatuses(d, grace);
      (d.installments||[]).filter(i=>i.status==='late').forEach(i=>overdueInsts.push({debt:d, inst:i}));
    }
  });
  const custIds = [...new Set(DATA.customers.map(c=>c.id))];
  const delinquentCustomers = custIds.filter(id=> DATA.debts.some(d=>d.customerId===id && d.status!=='cancelled' && isDelinquent(d,grace)) );

  const upcomingDays = DATA.settings.upcomingDays||7;
  const limitDate = addInterval(todayISO(),'daily',upcomingDays);
  let upcoming=[];
  activeDebts.forEach(d=>{
    if(d.paymentType==='installments'){
      (d.installments||[]).forEach(i=>{
        const due = i.amount - (i.paidAmount||0);
        if(due>0 && i.dueDate>=todayISO() && i.dueDate<=limitDate){ upcoming.push({debt:d, inst:i}); }
      });
    }
  });
  upcoming.sort((a,b)=> a.inst.dueDate.localeCompare(b.inst.dueDate));

  return `
  <div class="page-title">${t('dashboard')}</div>
  <div class="grid grid-4" style="margin-bottom:14px;">
    <div class="stat-card accent"><div class="val mono">${fmtMoney(totalIQD)}<span class="currency-tag">${t('iqd')}</span></div><div class="lbl">${t('total_dinar')}</div></div>
    <div class="stat-card accent"><div class="val mono">${fmtMoney(totalUSD)}<span class="currency-tag">${t('usd')}</span></div><div class="lbl">${t('total_dollar')}</div></div>
    <div class="stat-card danger"><div class="val">${overdueInsts.length}</div><div class="lbl">${t('overdue_installments')}</div></div>
    <div class="stat-card warn"><div class="val">${delinquentCustomers.length}</div><div class="lbl">${t('delinquent_customers')}</div></div>
  </div>
  <div class="grid grid-2" style="margin-bottom:14px;">
    <div class="stat-card"><div class="val">${DATA.customers.length}</div><div class="lbl">${t('total_customers')}</div></div>
    <div class="stat-card"><div class="val">${DATA.guarantors.length}</div><div class="lbl">${t('guarantors')}</div></div>
  </div>

  <div class="card">
    <div class="card-title">${ICONS.doc} ${t('upcoming_payments')} (${upcomingDays} ${CUR_LANG==='ar'?'يوم':CUR_LANG==='ku'?'ڕۆژ':'days'})</div>
    ${upcoming.length===0? `<div class="empty-state">${ICONS.empty}<div>${t('no_data')}</div></div>` :
      renderGridTable('2fr 1.2fr 1.3fr .9fr', [t('name'),t('due_date'),t('amount'),''],
        upcoming.slice(0,50).map(({debt,inst})=>{
          const c=DATA.customers.find(x=>x.id===debt.customerId);
          const curLabel = debt.currency==='IQD'?t('iqd'):t('usd');
          return { attrs:`data-goto-debt="${debt.id}"`, cells:[
            `<b>${esc(c?c.name:'-')}</b>`,
            `<span class="mono">${fmtDate(inst.dueDate)}</span>`,
            `<span class="mono">${fmtMoney(inst.amount-(inst.paidAmount||0))}</span> ${curLabel}`,
            c? `<button class="btn btn-sm btn-outline" style="white-space:nowrap; padding-inline:6px; font-size:10px;" data-send-reminder="${debt.id}" data-inst-idx="${inst.idx}" onclick="event.stopPropagation()">${t('send_reminder')}</button>` : ''
          ]};
        }), '340px')}
  </div>

  <div class="card">
    <div class="card-title">${ICONS.doc} ${t('overdue_installments')}</div>
    ${overdueInsts.length===0? `<div class="empty-state">${ICONS.empty}<div>${t('no_data')}</div></div>` :
      renderGridTable('2fr 1.3fr 1.1fr 1.1fr', [t('name'),t('due_date'),t('amount'),t('currency')],
        overdueInsts.slice(0,50).map(({debt,inst})=>{
          const c=DATA.customers.find(x=>x.id===debt.customerId);
          return { attrs:`data-goto-debt="${debt.id}"`, cells:[
            `<b>${esc(c?c.name:'-')}</b>`,
            `<span class="mono">${fmtDate(inst.dueDate)}</span>`,
            `<span class="mono">${fmtMoney(inst.amount-(inst.paidAmount||0))}</span>`,

function renderPagination(totalPages, page, key){
  if(totalPages<=1) return '';
  let nums=[];
  for(let i=1;i<=totalPages;i++){ if(i===1||i===totalPages||Math.abs(i-page)<=1) nums.push(i); else if(nums[nums.length-1]!=='...') nums.push('...'); }
  return `<div class="pagination">
    <button class="page-num" data-page="${Math.max(1,page-1)}" data-pagekey="${key}">‹</button>
    ${nums.map(n=> n==='...' ? `<span style="color:var(--text-mute);">…</span>` : `<button class="page-num ${n===page?'active':''}" data-page="${n}" data-pagekey="${key}">${n}</button>`).join('')}
    <button class="page-num" data-page="${Math.min(totalPages,page+1)}" data-pagekey="${key}">›</button>
  </div>`;
}

/* ---- Record payment for my debt ---- */
function openRecordMyDebtPayment(debtId, instIdx){
  const d = DATA.myDebts.find(x=>x.id===debtId);
  const curLabel = d.currency==='IQD'? t('iqd'): t('usd');
  let defaultAmt = 0;
  if(d.paymentType==='installments'){
    const inst = d.installments.find(i=>i.idx===instIdx);
    defaultAmt = inst.amount - (inst.paidAmount||0);
  } else {
    defaultAmt = debtRemaining(d);
  }
  openModal(`
    <div class="modal-head"><h3>${t('record_payment')}</h3><button class="icon-btn" data-action="close-modal">✕</button></div>
    <div class="field"><label>${t('payment_date')}</label><input type="date" id="pay-my-date" value="${todayISO()}"></div>
    <div class="field"><label>${t('amount')} (${curLabel})</label><input type="number" id="pay-my-amount" value="${defaultAmt}" min="1"></div>
    <div class="field"><label>${t('note')}</label><textarea id="pay-my-note" rows="2"></textarea></div>
    <div id="overpay-my-note" class="hint" style="display:none; color:var(--warn);">${t('overpaid_note')}</div>
    <button class="btn btn-primary btn-block" data-action="save-my-payment">${t('save')}</button>
  `);
  document.querySelector('[data-action="close-modal"]').onclick=closeModal;
  const amtInput=document.getElementById('pay-my-amount');
  amtInput.oninput=()=>{
    if(d.paymentType==='installments'){
      const inst=d.installments.find(i=>i.idx===instIdx);
      const due=inst.amount-(inst.paidAmount||0);
      document.getElementById('overpay-my-note').style.display = Number(amtInput.value)>due? 'block':'none';
    }
  };
  document.querySelector('[data-action="save-my-payment"]').onclick=()=>{
    const date=document.getElementById('pay-my-date').value || todayISO();
    const amount=Math.round(Number(document.getElementById('pay-my-amount').value));
    const note=document.getElementById('pay-my-note').value.trim();
    if(!amount || amount<=0){ toast(t('required_field'),'error'); return; }
    if(d.paymentType==='installments'){
      applyPaymentToInstallment(d, instIdx, amount);
    }
    d.payments = d.payments||[];
    d.payments.push({id:uid(), date, amount, note, installmentIdx:instIdx, cancelled:false});
    addAudit('myDebt', d.id, 'payment_added', 'payment', '', `${amount} ${date}`);
    d.status = computeDebtStatus(d, DATA.settings.gracePeriodDays||0);
    persist();
    closeModal();
    toast(t('saved_ok'),'success');
    render();
  };
}

    document.getElementById('my-creditor-name').oninput=(e)=>{ st.creditorName=e.target.value; };
    document.getElementById('my-creditor-phone').oninput=(e)=>{ e.target.value=digitsOnly(e.target.value).slice(0,11); st.creditorPhone=e.target.value; };
    document.getElementById('my-principal').oninput=(e)=>{ st.principal=e.target.value; updatePreview(); };
    document.getElementById('my-currency-select').onchange=(e)=>{ st.currency=e.target.value; };
    document.getElementById('my-type-select').onchange=(e)=>{ st.paymentType=e.target.value; renderForm(); };
    document.getElementById('my-note').oninput=(e)=>{ st.note=e.target.value; };
    const calcSel=document.getElementById('my-calc-select'); if(calcSel) calcSel.onchange=(e)=>{ st.calcMode=e.target.value; renderForm(); };
    const iv=document.getElementById('my-inputval'); if(iv) iv.oninput=(e)=>{ st.inputValue=e.target.value; updatePreview(); };
    const sd=document.getElementById('my-startdate'); if(sd) sd.onchange=(e)=>{ st.startDate=e.target.value; updatePreview(); };
    const fr=document.getElementById('my-freq'); if(fr) fr.onchange=(e)=>{ st.frequency=e.target.value; updatePreview(); };
    document.querySelector('[data-action="save-my-debt"]').onclick=saveMyDebt;
  }
  function updatePreview(){
    const principal=Number(st.principal)||0;
    const prev=document.getElementById('my-calc-preview');
    if(!prev) return;
    if(st.paymentType==='installments' && principal>0 && Number(st.inputValue)>0){
      const insts=buildInstallments(principal, st.calcMode, st.inputValue, st.startDate, st.frequency);
      prev.innerHTML = `
      <div class="card" style="background:var(--accent-soft); border-color:var(--accent);">
        <div class="card-title">${t('calc_result')}</div>
        <div class="kv-row"><span class="k">${t('total_installments_result')}</span><span class="v">${insts.length}</span></div>
        <div class="kv-row"><span class="k">${t('installment_amount_result')}</span><span class="v mono">${fmtMoney(insts[0].amount)}</span></div>
        <div class="hint">${t('last_installment_note')}: ${fmtMoney(insts[insts.length-1].amount)}</div>
      </div>`;
    } else { prev.innerHTML=''; }
  }
  function saveMyDebt(){
    const name=document.getElementById('my-creditor-name').value.trim();
    document.getElementById('f-cred-name').classList.toggle('invalid', !name);
    const principal=Math.round(Number(st.principal));
    if(!name || !principal || principal<=0){ toast(t('required_field'),'error'); return; }
    if(st.paymentType==='installments' && !(Number(st.inputValue)>0)){ toast(t('required_field'),'error'); return; }
    const doSave = ()=>{
      if(existing){
        existing.creditorName=name; existing.creditorPhone=st.creditorPhone;
        existing.principal=principal; existing.currency=st.currency; existing.paymentType=st.paymentType;
        existing.note=st.note;
        if(st.paymentType==='installments'){
          existing.calcMode=st.calcMode; existing.inputValue=Number(st.inputValue);
          existing.startDate=st.startDate; existing.frequency=st.frequency;
          existing.installments = buildInstallments(principal, st.calcMode, st.inputValue, st.startDate, st.frequency);
        } else { existing.installments=[]; }
        existing.status = computeDebtStatus(existing, DATA.settings.gracePeriodDays||0);
        addAudit('myDebt', existing.id, 'edited', 'principal', '', principal);
      } else {
        const rec = {
          id:uid(), creditorName:name, creditorPhone:st.creditorPhone, currency:st.currency, principal,
          paymentType:st.paymentType, startDate:st.startDate, frequency:st.frequency, note:st.note,
          status:'active', favorite:false, createdAt:new Date().toISOString(), payments:[]
        };
        if(st.paymentType==='installments'){
          rec.calcMode=st.calcMode; rec.inputValue=Number(st.inputValue);
          rec.installments = buildInstallments(principal, st.calcMode, st.inputValue, st.startDate, st.frequency);
        } else { rec.installments=[]; }
        DATA.myDebts.push(rec);
        addAudit('myDebt', rec.id, 'created', '', '', `${principal} ${st.currency}`);
      }
      persist(); closeModal(); toast(t('saved_ok'),'success');
      if(!existing) setRoute('myDebts'); else render();
    };
    if(hasPayments){
      openModal(`
        <div class="modal-head"><h3>${t('confirm_recalc')}</h3></div>
        <p style="font-size:13px; color:var(--text-dim);">${t('edit_warning')}</p>
        <div class="flex-gap"><button class="btn btn-danger" id="yes-recalc-my">${t('yes_recalc')}</button><button class="btn btn-outline" id="no-recalc-my">${t('no_go_back')}</button></div>
      `);
      document.getElementById('yes-recalc-my').onclick=doSave;
      document.getElementById('no-recalc-my').onclick=closeModal;
    } else { doSave(); }
  }
  renderForm();
}

/* ---- Record payment ---- */
function openRecordPayment(debtId, instIdx){
  const d = DATA.debts.find(x=>x.id===debtId);
  const curLabel = d.currency==='IQD'? t('iqd'): t('usd');
  let defaultAmt = 0;
  if(d.paymentType==='installments'){
    const inst = d.installments.find(i=>i.idx===instIdx);
    defaultAmt = inst.amount - (inst.paidAmount||0);
  } else {
    defaultAmt = debtRemaining(d);
  }
  openModal(`
    <div class="modal-head"><h3>${t('record_payment')}</h3><button class="icon-btn" data-action="close-modal">✕</button></div>
    <div class="field"><label>${t('payment_date')}</label><input type="date" id="pay-date" value="${todayISO()}"></div>
    <div class="field"><label>${t('amount')} (${curLabel})</label><input type="number" id="pay-amount" value="${defaultAmt}" min="1"></div>
    <div class="field"><label>${t('note')}</label><textarea id="pay-note" rows="2"></textarea></div>
    <div id="overpay-note" class="hint" style="display:none; color:var(--warn);">${t('overpaid_note')}</div>
    <button class="btn btn-primary btn-block" data-action="save-payment">${t('save')}</button>
  `);
  document.querySelector('[data-action="close-modal"]').onclick=closeModal;
  const amtInput=document.getElementById('pay-amount');
  amtInput.oninput=()=>{
    if(d.paymentType==='installments'){
      const inst=d.installments.find(i=>i.idx===instIdx);
      const due=inst.amount-(inst.paidAmount||0);
      document.getElementById('overpay-note').style.display = Number(amtInput.value)>due? 'block':'none';
    }
  };
  document.querySelector('[data-action="save-payment"]').onclick=()=>{
    const date=document.getElementById('pay-date').value || todayISO();
    const amount=Math.round(Number(document.getElementById('pay-amount').value));
    const note=document.getElementById('pay-note').value.trim();
    if(!amount || amount<=0){ toast(t('required_field'),'error'); return; }
    const payId=uid();
    const receiptNo = nextReceiptNo('payment');
    if(d.paymentType==='installments'){
      applyPaymentToInstallment(d, instIdx, amount);
    }
    d.payments = d.payments||[];
    d.payments.push({id:payId, date, amount, note, installmentIdx:instIdx, receiptNo, cancelled:false});
    addAudit('debt', d.id, 'payment_added', 'payment', '', `${amount} ${date}`);
    // update overall debt status
    d.status = computeDebtStatus(d, DATA.settings.gracePeriodDays||0);
    persist();
    closeModal();
    toast(t('saved_ok'),'success');
    render();
    printPaymentReceipt(d.id, payId);
  };
}

      </div>

        <div class="field"><label>${t('frequency')}</label><select id="ed-freq">
          <option value="daily" ${d.frequency==='daily'?'selected':''}>${t('daily')}</option>
          <option value="weekly" ${d.frequency==='weekly'?'selected':''}>${t('weekly')}</option>
          <option value="monthly" ${d.frequency==='monthly'?'selected':''}>${t('monthly')}</option>
        </select></div>
      </div>
    </div>
    <button class="btn btn-primary btn-block" data-action="save-edit-debt">${t('save')}</button>
  `);
  let curType=d.paymentType, curCalc=d.calcMode;
  document.querySelector('[data-action="close-modal"]').onclick=closeModal;
  document.getElementById('ed-type-select').onchange=(e)=>{
    curType=e.target.value;
    document.getElementById('ed-inst-fields').style.display = curType==='installments'?'':'none';
  };
  document.getElementById('ed-calc-select').onchange=(e)=>{
    curCalc=e.target.value;
    document.getElementById('ed-inputval-label').textContent = curCalc==='amount'?t('installment_amount'):t('installments_count');
  };
  document.querySelector('[data-action="save-edit-debt"]').onclick=()=>{
    const newPrincipal = Math.round(Number(document.getElementById('ed-principal').value));
    if(!newPrincipal || newPrincipal<=0){ toast(t('required_field'),'error'); return; }
    // capture all field values NOW, before any confirmation dialog replaces the DOM
    const capturedType = curType;
    const capturedCalc = curCalc;
    const capturedInputValue = document.getElementById('ed-inputval') ? Number(document.getElementById('ed-inputval').value) : null;
    const capturedStartDate = document.getElementById('ed-startdate') ? document.getElementById('ed-startdate').value : null;
    const capturedFreq = document.getElementById('ed-freq') ? document.getElementById('ed-freq').value : null;
    if(capturedType==='installments' && !(capturedInputValue>0)){ toast(t('required_field'),'error'); return; }
    const doRebuild = ()=>{
      const oldPrincipal=d.principal;
      d.principal = newPrincipal;
      d.paymentType = capturedType;
      if(capturedType==='installments'){
        d.calcMode = capturedCalc;
        d.inputValue = capturedInputValue;
        d.startDate = capturedStartDate;
        d.frequency = capturedFreq;
        d.installments = buildInstallments(d.principal, d.calcMode, d.inputValue, d.startDate, d.frequency);
      } else {
        d.installments = [];
      }
      addAudit('debt', d.id, 'edited', 'principal', oldPrincipal, newPrincipal);
      d.status = computeDebtStatus(d, DATA.settings.gracePeriodDays||0);
      persist(); closeModal(); toast(t('saved_ok'),'success'); render();
    };
    if(hasPayments){
      openModal(`
        <div class="modal-head"><h3>${t('confirm_recalc')}</h3></div>
        <p style="font-size:13px; color:var(--text-dim);">${t('edit_warning')}</p>
        <div class="flex-gap"><button class="btn btn-danger" id="yes-recalc">${t('yes_recalc')}</button><button class="btn btn-outline" id="no-recalc">${t('no_go_back')}</button></div>
      `);
      document.getElementById('yes-recalc').onclick=doRebuild;
      document.getElementById('no-recalc').onclick=closeModal;
    } else { doRebuild(); }
  };
}

function normalizeForWA(phone){
  // Iraqi local numbers start with 0, WhatsApp needs country code (964) without leading 0
  let p = digitsOnly(phone);
  if(p.startsWith('0')) p = '964'+p.slice(1);
  return p;
}

function updateWizardPreview(){
  const principal=Number(WZ.principal)||0;
  const prev=document.getElementById('wz-calc-preview');
  if(!prev) return;
  if(WZ.paymentType==='installments' && principal>0 && Number(WZ.inputValue)>0){
    const insts=buildInstallments(principal, WZ.calcMode, WZ.inputValue, WZ.startDate, WZ.frequency);
    prev.innerHTML = `
    <div class="card" style="background:var(--accent-soft); border-color:var(--accent);">
      <div class="card-title">${t('calc_result')}</div>
      <div class="kv-row"><span class="k">${t('total_installments_result')}</span><span class="v">${insts.length}</span></div>

    </div>`;

function saveWizardDebt(){
  const principal=Math.round(Number(WZ.principal));
  if(!principal || principal<=0){ toast(t('required_field'),'error'); return; }
  if(WZ.paymentType==='installments' && !(Number(WZ.inputValue)>0)){ toast(t('required_field'),'error'); return; }
  const debt = {
    id: uid(), customerId: WZ.customerId, guarantorIds: WZ.guarantorIds.slice(),
    currency: WZ.currency, principal, paymentType: WZ.paymentType,
    startDate: WZ.startDate, frequency: WZ.frequency,
    status:'active', favorite:false, createdAt:new Date().toISOString(),
    payments:[]
  };
  if(WZ.paymentType==='installments'){
    debt.calcMode = WZ.calcMode; debt.inputValue = Number(WZ.inputValue);
    debt.installments = buildInstallments(principal, WZ.calcMode, WZ.inputValue, WZ.startDate, WZ.frequency);
  } else { debt.installments=[]; }
  debt.receiptNo = nextReceiptNo('debt');
  DATA.debts.push(debt);
  addAudit('debt','created',debt.id,'','',`${principal} ${debt.currency}`);
  persist();
  closeModal();
  toast(t('saved_ok'),'success');
  const savedId = debt.id;
  WZ=null;
  setRoute('debtDetail',{id:savedId});
  setTimeout(()=>printStartReceipt(savedId), 400);
}

function openQuickPaySearch(){
  openModal(`
    <div class="modal-head"><h3>${t('quick_pay')}</h3><button class="icon-btn" data-action="close-modal">✕</button></div>
    <div class="search-box">${ICONS.search}<input id="qp-search" placeholder="${t('customer_search')}"></div>

  `);
  document.querySelector('[data-action="close-modal"]').onclick=closeModal;
  const input=document.getElementById('qp-search');
  const results=document.getElementById('qp-results');
  function doSearch(){
    const q=input.value.trim();
    if(!q){ results.innerHTML=''; return; }
    const list=DATA.customers.filter(c=>c.name.includes(q)||(c.phone||'').includes(q)).slice(0,15);
    results.innerHTML = list.map(c=>`<div class="card" style="cursor:pointer; padding:10px;" data-qp-customer="${c.id}"><b>${esc(c.name)}</b> — <span class="text-dim" style="font-size:12px;">${esc(c.phone)}</span></div>`).join('') || `<div class="empty-state">${t('no_data')}</div>`;
    document.querySelectorAll('[data-qp-customer]').forEach(el=>el.onclick=()=>showQpDebts(el.dataset.qpCustomer));
  }
  input.oninput=doSearch;
}
function showQpDebts(customerId){
  const debts = DATA.debts.filter(d=>d.customerId===customerId && d.status!=='cancelled' && debtRemaining(d)>0);
  const results=document.getElementById('qp-results');
  if(debts.length===0){ results.innerHTML=`<div class="empty-state">${t('no_data')}</div>`; return; }
  results.innerHTML = `<div class="section-label">${t('pick_debt')}</div>` + debts.map(d=>{
    const rem=debtRemaining(d);
    return `<div class="card" style="cursor:pointer; padding:10px;" data-qp-debt="${d.id}">
      <div class="flex-between"><b>${fmtMoney(d.principal)} ${d.currency==='IQD'?t('iqd'):t('usd')}</b>${statusBadge(computeDebtStatus(d,DATA.settings.gracePeriodDays||0))}</div>
      <div class="text-dim" style="font-size:12px;">${t('remaining')}: ${fmtMoney(rem)}</div>
    </div>`;
  }).join('');
  document.querySelectorAll('[data-qp-debt]').forEach(el=>el.onclick=()=>{
    const debtId=el.dataset.qpDebt;
    const d=DATA.debts.find(x=>x.id===debtId);
    closeModal();
    if(d.paymentType==='installments'){
      refreshInstallmentStatuses(d, DATA.settings.gracePeriodDays||0);
      const nextInst = d.installments.find(i=>(i.amount-(i.paidAmount||0))>0);
      setRoute('debtDetail',{id:debtId});
      if(nextInst) setTimeout(()=>openRecordPayment(debtId, nextInst.idx), 250);
    } else {
      setRoute('debtDetail',{id:debtId});
      setTimeout(()=>openRecordPayment(debtId, 1), 250);
    }
  });
}

function filteredFavorites(){
  const q = (UI.filters.favorites.q||'').trim();
  let favCustomers = DATA.customers.filter(c=>c.favorite);
  let favGuarantors = DATA.guarantors.filter(g=>g.favorite);
  let favDebts = DATA.debts.filter(d=>d.favorite);
  if(q){
    favCustomers = favCustomers.filter(c=> c.name.includes(q) || (c.phone||'').includes(q));
    favGuarantors = favGuarantors.filter(g=> g.name.includes(q) || (g.phone||'').includes(q));
    favDebts = favDebts.filter(d=>{

async function refreshAppInfoFromServer(){
  try{
    const res = await fetch(LICENSE_SERVER_URL + '/api/app-info');
    if(!res.ok) return;
    const info = await res.json();
    let changed = false;
    if(DATA.settings.aboutText !== info.aboutText){ DATA.settings.aboutText = info.aboutText; changed=true; }
    if(DATA.settings.whatsapp !== info.whatsapp){ DATA.settings.whatsapp = info.whatsapp; changed=true; }
    if(DATA.settings.email !== info.email){ DATA.settings.email = info.email; changed=true; }
    if(DATA.settings.companyName !== info.companyName){ DATA.settings.companyName = info.companyName; changed=true; }
    if(changed){ persist(); if(UI.route==='settings' && UI.settingsTab==='about') render(); }
  }catch(e){ /* offline or server unreachable: silently keep last cached values */ }
}

function autoSaveField(applyFn){

}
function attachSettingsEvents(){
  document.querySelectorAll('[data-settings-nav]').forEach(btn=>{
    btn.onclick=()=>{
      UI.settingsTab = btn.dataset.settingsNav;
      render();
      if(UI.settingsTab==='about') refreshAppInfoFromServer();
    };
  });
  const settingsBackBtn = document.querySelector('[data-action="settings-back"]');
  if(settingsBackBtn) settingsBackBtn.onclick=()=>{ UI.settingsTab = null; render(); };
  const logoutBtn=document.querySelector('[data-action="do-logout"]');
  if(logoutBtn) logoutBtn.onclick=()=>{ UI.loggedIn=false; render(); };

  const tab = UI.settingsTab;
  if(!tab) return;

  if(tab==='account'){
    const shopInput = document.getElementById('st-shop');
    shopInput.onchange=()=>autoSaveField(s=>{ s.shopName = shopInput.value.trim(); });
    document.getElementById('st-logo').onchange=async(e)=>{
      const f=e.target.files[0]; if(!f) return;
      const logoData = await compressImage(f, 300, 0.8);
      document.getElementById('st-logo-preview').innerHTML=`<img src="${logoData}">`;
      autoSaveField(s=>{ s.shopLogo = logoData; });
    };
    const userInput = document.getElementById('st-user');
    userInput.onchange=()=>{ const v=userInput.value.trim(); if(v) autoSaveField(s=>{ s.username=v; }); };
    const passInput = document.getElementById('st-pass');
    const passConfirmInput = document.getElementById('st-pass-confirm');
    const validateAndSavePassword=()=>{
      const v=passInput.value;
      const vc=passConfirmInput.value;
      if(!v) return; // nothing typed, nothing to do
      document.getElementById('f-st-pass-confirm').classList.remove('invalid');
      if(v!==vc){
        document.getElementById('f-st-pass-confirm').classList.add('invalid');
        return;
      }
      autoSaveField(s=>{ s.password=v; });
      passInput.value=''; passConfirmInput.value='';
      passInput.placeholder='••••••••'; passConfirmInput.placeholder='••••••••';
    };
    passInput.onchange=validateAndSavePassword;
    passConfirmInput.onchange=validateAndSavePassword;
  }

  if(tab==='general'){
    document.getElementById('st-lang-select').onchange=(e)=>{ autoSaveField(s=>{ s.language=e.target.value; }); render(); };
    document.getElementById('st-theme-select').onchange=(e)=>{ autoSaveField(s=>{ s.theme=e.target.value; }); render(); };
    const rowsInput = document.getElementById('st-rows');
    rowsInput.onchange=()=>autoSaveField(s=>{ s.rowsPerPage = Math.max(5, Number(rowsInput.value)||20); });
    const upInput = document.getElementById('st-updays');
    upInput.onchange=()=>autoSaveField(s=>{ s.upcomingDays = Math.max(1, Number(upInput.value)||7); });
    const graceInput = document.getElementById('st-grace');
    graceInput.onchange=()=>autoSaveField(s=>{ s.gracePeriodDays = Math.max(0, Number(graceInput.value)||0); });
  }

  if(tab==='receipts'){
    const debtRecv = document.getElementById('st-recv-debt');
    debtRecv.onchange=()=>autoSaveField(s=>{ s.receiptStartDebt = Math.max(1, Number(debtRecv.value)||1); });
    const payRecv = document.getElementById('st-recv-pay');
    payRecv.onchange=()=>autoSaveField(s=>{ s.receiptStartPayment = Math.max(1, Number(payRecv.value)||1); });
  }

  if(tab==='backup'){
    document.querySelector('[data-action="export-backup"]').onclick=exportBackup;
    const seedSmallBtn=document.querySelector('[data-action="seed-demo-small"]');
    if(seedSmallBtn) seedSmallBtn.onclick=()=>{ generateDemoData({customers:25, guarantors:10, debts:30}); toast(t('saved_ok'),'success'); render(); };
    const seedLargeBtn=document.querySelector('[data-action="seed-demo-large"]');
    if(seedLargeBtn) seedLargeBtn.onclick=()=>{ generateDemoData({customers:80, guarantors:40, debts:80}); toast(t('saved_ok'),'success'); render(); };
    document.getElementById('st-import').onchange=(e)=>{
      const f=e.target.files[0]; if(!f) return;
      const reader=new FileReader();
      reader.onload=(ev)=>{
        try{
          const imported=JSON.parse(ev.target.result);
          if(!imported.customers||!imported.debts){ toast(t('error_generic'),'error'); return; }
          DATA = imported;
          persist(); toast(t('saved_ok'),'success'); render();
        }catch(err){ toast(t('error_generic'),'error'); }
      };
      reader.readAsText(f);
    };
  }

  if(tab==='about'){
    attachPhoneLinks();
  }
}
/* ---------------- Demo/Test Data Seeder ---------------- */
function generateDemoData(opts){
  opts = opts || {};
  const NUM_CUSTOMERS = opts.customers || 25;
  const NUM_GUARANTORS = opts.guarantors || 10;
  const NUM_DEBTS = opts.debts || 30;
  const firstNames=['أحمد','محمد','علي','حسين','كريم','سلام','رعد','ياسر','عمار','مصطفى','زينب','فاطمة','سارة','نور','رنا','هدى','سلوى','ميساء','دعاء','آمنة','حيدر','مهند','سجاد','بشرى','إيمان','وسام','فراس','ليث','رغد','شهد'];
  const lastNames=['العبيدي','الجبوري','الساعدي','الكعبي','الخفاجي','التميمي','الزبيدي','الدليمي','الشمري','البياتي','السلطاني','الموسوي','الحسيني','العامري','الفتلاوي','الغزي','السعدون','الربيعي'];
  const streets=['الكرادة','المنصور','الدورة','الشعب','زيونة','اليرموك','الجادرية','البياع','حي الجهاد','الأعظمية','الحرية','الشعلة','الغزالية','بغداد الجديدة'];
  const notes=['','عميل منتظم','تأخر سابقاً مرة واحدة','عنوان بديل متوفر','','',''];
  function randOf(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
  function randName(){ return randOf(firstNames)+' '+randOf(lastNames); }
  function randPhone(){ return '07'+String(Math.floor(Math.random()*100000000)).padStart(9,'0'); }
  function randPastDate(maxDaysBack){ return addInterval(todayISO(),'daily', -Math.floor(Math.random()*maxDaysBack)); }

  const newCustomers=[]; const newGuarantors=[]; const newDebts=[]; let opCount=0;

  for(let i=0;i<NUM_CUSTOMERS;i++){
    const c={id:uid(), name:randName(), phone:randPhone(), address:randOf(streets)+' - محلة '+(100+i), note:randOf(notes), idImage:null, favorite:Math.random()<0.1, createdAt:new Date().toISOString()};
    newCustomers.push(c); opCount++;
  }
  for(let i=0;i<NUM_GUARANTORS;i++){
    const g={id:uid(), name:randName(), phone:randPhone(), note:randOf(notes), idImage:null, favorite:Math.random()<0.1, createdAt:new Date().toISOString()};
    newGuarantors.push(g); opCount++;
  }
  for(let i=0;i<NUM_DEBTS;i++){
    const customer = randOf(newCustomers);
    const guarCount = Math.random()<0.25 ? 2:1;
    const guarIds = []; 
    while(guarIds.length<guarCount){ const g=randOf(newGuarantors); if(!guarIds.includes(g.id)) guarIds.push(g.id); }
    const currency = Math.random()<0.65 ? 'IQD':'USD';
    const principal = currency==='IQD' ? [250000,500000,750000,1000000,1500000,2000000][Math.floor(Math.random()*6)] : [100,200,300,500,800,1000][Math.floor(Math.random()*6)];
    const paymentType = Math.random()<0.75 ? 'installments':'single';
    const startDate = randPastDate(120);
    const frequency = randOf(['monthly','monthly','monthly','weekly','daily']);
    const debt = {
      id:uid(), customerId:customer.id, guarantorIds:guarIds, currency, principal, paymentType,
      startDate, frequency, status:'active', favorite:Math.random()<0.08, createdAt:new Date().toISOString(), payments:[]
    };
    if(paymentType==='installments'){
      const calcMode = Math.random()<0.5?'amount':'count';
      const inputValue = calcMode==='amount' ? Math.round(principal/(2+Math.floor(Math.random()*6))) : (2+Math.floor(Math.random()*8));
      debt.calcMode=calcMode; debt.inputValue=inputValue;
      debt.installments = buildInstallments(principal, calcMode, inputValue, startDate, frequency);
      const payCount = Math.floor(Math.random()*debt.installments.length*0.6);
      for(let k=0;k<payCount;k++){
        const inst = debt.installments[k];
        inst.paidAmount = inst.amount;
        const payId=uid();
        debt.payments.push({id:payId, date: addInterval(inst.dueDate,'daily',-Math.floor(Math.random()*5)), amount:inst.amount, note:'', installmentIdx:inst.idx, receiptNo: pad4(opCount+1), cancelled:false});
        opCount++;
      }
    } else {
      debt.installments=[];
      if(Math.random()<0.4){
        const paid = Math.round(principal*(0.3+Math.random()*0.6));
        const payId=uid();
        debt.payments.push({id:payId, date: randPastDate(30), amount:paid, note:'', installmentIdx:1, receiptNo: pad4(opCount+1), cancelled:false});
        opCount++;
      }
    }
    debt.receiptNo = pad4(opCount+1); opCount++;
    debt.status = computeDebtStatus(debt, DATA.settings.gracePeriodDays||0);
    newDebts.push(debt); opCount++;
  }

  DATA.customers.push(...newCustomers);
  DATA.guarantors.push(...newGuarantors);
  DATA.debts.push(...newDebts);
  addAudit('system', 'seed', 'demo_data_generated', '', '', `${newCustomers.length} customers, ${newGuarantors.length} guarantors, ${newDebts.length} debts`);
  persist();
  return { customers:newCustomers.length, guarantors:newGuarantors.length, debts:newDebts.length, totalOps:opCount };
}

function exportBackup(){
  DATA.settings.lastBackupDate = todayISO();
  persist();
  const blob = new Blob([JSON.stringify(DATA,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download='debt-manager-backup.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast(t('saved_ok'),'success');
}
function checkWeeklyAutoBackup(){
  const last = DATA.settings.lastBackupDate;
  const days = last? daysBetween(last, todayISO()) : 999;
  if(days>=7){ exportBackup(); }
}

/* ---------------- Boot ---------------- */
function mergeDefaults(loaded){
  const def = defaultData();
  if(!loaded) return def;
  loaded.customers = loaded.customers||[];
  loaded.guarantors = loaded.guarantors||[];
  loaded.debts = loaded.debts||[];
  loaded.myDebts = loaded.myDebts||[];
  loaded.auditLog = loaded.auditLog||[];
  loaded.settings = Object.assign({}, def.settings, loaded.settings||{});
  loaded.settings.plans = loaded.settings.plans && loaded.settings.plans.length? loaded.settings.plans : def.settings.plans;
  return loaded;
}
async function boot(){
  try{
    await dbOpen();
    const loaded = await dbGet();
    DATA = mergeDefaults(loaded);
    if(!loaded) await persist();
  }catch(err){
    console.error(err);
    DATA = defaultData();
  }
  CUR_LANG = DATA.settings.language || 'ar';
  render();
  if(DATA.settings.activationCode){
    await checkSubscriptionStatus();
    render();
  }
}
window.addEventListener('DOMContentLoaded', boot);
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('service-worker.js').catch(()=>{});
  });
}
